name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag matching all version manifests (for example v1.0.0)"
        required: true
        type: string
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun run test:docs
      - run: bun run test:release
      - run: bun run test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-report
          path: |
            reports/unit.xml
            reports/unit-coverage/
          if-no-files-found: error
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bunx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            reports/e2e.json
            reports/e2e-report/
            e2e-results/screenshots/
          if-no-files-found: error
  docs:
    needs: [unit, e2e]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    outputs:
      page_url: ${{ steps.deploy.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: unit-report
          path: reports
      - uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: .
      - run: bun run docs:features
      - run: bun run docs:reports
      - uses: actions/upload-artifact@v4
        with:
          name: release-docs
          path: |
            docs-site/
            README.md
            reports/
            playwright-report/
            e2e-results/screenshots/
          if-no-files-found: error
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site
      - id: deploy
        uses: actions/deploy-pages@v4
  release-check:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/release.mjs validate
  build:
    needs: [unit, e2e, release-check]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - runner: ubuntu-22.04
            platform: linux
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - runner: macos-latest
            platform: macos
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - name: Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 xdg-utils
      - run: bun install --frozen-lockfile
      - name: Build unsigned installers
        run: bun run tauri build --ci --no-sign --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Collect release bundles
        run: node scripts/release.mjs collect ${{ matrix.platform }} ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: release-assets/
          if-no-files-found: error
  release:
    needs: [unit, e2e, release-check, build, docs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.release-check.outputs.tag }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.release-check.outputs.tag }}
      PAGES_URL: ${{ needs.docs.outputs.page_url }}
      PRERELEASE: ${{ needs.release-check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: release-docs
          path: .
      - run: node scripts/release.mjs prepare
      - name: Create draft and upload all release assets
        shell: bash
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$PRERELEASE" == "true" ]]; then prerelease=(--prerelease); fi
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Orbita $RELEASE_TAG" --notes-file release-assets/RELEASE-NOTES.md --draft "${prerelease[@]}"
          gh release upload "$RELEASE_TAG" release-assets/*
          gh release edit "$RELEASE_TAG" --draft=false
